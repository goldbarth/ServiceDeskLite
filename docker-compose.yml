services:

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: servicedesklite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Optional: expose for local DB tooling (DBeaver, psql, etc.). The host port is
      # overridable because 5432 is the first port any other Postgres on the machine takes;
      # the container port never moves, so the API's connection string stays untouched.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicedesklite"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Point the Web client at whatever this resolves to: ApiClient__BaseUrl=http://localhost:${API_PORT}
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Persistence__Provider: Postgres
      ConnectionStrings__ServiceDeskLite: "Host=db;Port=5432;Database=servicedesklite;Username=postgres;Password=postgres"
      # AI assistant: export ANTHROPIC_API_KEY before `docker compose up` to enable it.
      # The placeholder lets the API boot without a key; assistant requests then fail gracefully.
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-placeholder-assistant-disabled}
      # Semantic ticket search (RAG): export VOYAGE_API_KEY to enable embeddings.
      # The placeholder disables the embedding worker and similarity search gracefully.
      Voyage__ApiKey: ${VOYAGE_API_KEY:-placeholder-rag-disabled}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
